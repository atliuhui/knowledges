knowledge_base_root: "%USERPROFILE%\\knowledges"

paths:
  docs_dir: "docs"
  text_dir: "text"
  data_dir: "data"
  logs_dir: "logs"
  apps_dir: "apps"
  apps_data_dir: "apps_data"    # 本地 web 服务（PocketBase 等）的运行态数据：SQLite / 上传 / migrations / admin 凭据
  docs_data: "store\\docs.csv"
  db_data: "store\\db.sqlite"
  fulltext_index_dir: "store\\fulltext"
  vector_index_dir: "store\\vector"

apps:
  # Loopback HTTP server (PocketBase) hosting agent-generated H5 offline apps
  # under <knowledge_base_root>\apps\<slug>\. Start with
  # `.\actions\start-pocketbase.ps1` after running `download-pocketbase.ps1`.
  # `actions\start-miniserve.ps1` (miniserve) is kept as a lightweight
  # fallback that serves the same `apps\<slug>\` layout.
  #
  # host:
  #   "127.0.0.1" 仅本机回环；"0.0.0.0" 监听所有网卡，局域网其它机器可通过
  #   本机 IP 访问（注意：PocketBase admin UI 也会一起暴露，按需配置防火墙）。
  host: "127.0.0.1"
  port: 8788
  # Base URL advertised by kb_create_app / kb_list_apps in chat cards.
  # Leave null to derive from `http://{host}:{port}` automatically.
  base_url: null

engines:
  fulltext: "tantivy"
  vector: "lancedb"

chunking:
  max_chars: 1200
  overlap_chars: 150
  version: "chunking-v1"

embedding:
  # Embeddings are served by a local Ollama process. Start it via `ollama serve`
  # and pull the model with `ollama pull qwen3-embedding:0.6b` before ingest.
  provider: "ollama"
  # Default: Qwen3-Embedding-0.6B (1024-dim). Upgrade paths:
  #   qwen3-embedding:4b  -> dimension: 2560
  #   qwen3-embedding:8b  -> dimension: 4096
  model: "qwen3-embedding:0.6b"
  dimension: 1024
  # L2-normalize vectors client-side for stable cosine/L2 behavior in LanceDB.
  normalize: true
  # Optional Ollama endpoint. Leave null to use the default (127.0.0.1:11434
  # or the OLLAMA_HOST environment variable).
  host: null
  # Forwarded to Ollama's `keep_alive`. Use e.g. "24h" or -1 to pin the model
  # in memory across calls, or null to use Ollama's default (5 minutes).
  keep_alive: -1

text_pipeline:
  # Bump this version to invalidate every cached text conversion when the
  # underlying MarkItDown library or its options change in a meaningful way.
  version: "text-v1"
  # ---- Image OCR (.png/.jpg/.jpeg) via RapidOCR ----
  # Cross-platform OCR (Windows / Linux / macOS Intel & Apple Silicon),
  # backed by onnxruntime. Default stack: PP-OCRv5 mobile (CPU-friendly,
  # ~21 MB total models), covers simplified/traditional Chinese + English
  # + Japanese. EXIF metadata is appended separately via MarkItDown.
  image_ocr_version: "PP-OCRv5"     # PP-OCRv5 / PP-OCRv4 / PP-OCRv3
  image_ocr_model_type: "mobile"    # mobile / server
  # Language tags applied to det/rec models separately. Common rec values:
  # "ch" (中英), "en", "japan", "korean", "chinese_cht", "latin",
  # "arabic", "cyrillic", "devanagari". Det usually stays "ch" or "en".
  image_ocr_lang_det: "ch"
  image_ocr_lang_rec: "ch"
  # ---- Audio / video transcription via sherpa-onnx + SenseVoice-Small ----
  # Drop the extracted model directory here (must contain `model.int8.onnx`
  # or `model.onnx` and `tokens.txt`). Relative paths resolve against the
  # repository root. Default: `models/sense-voice` next to pyproject.toml.
  audio_model_dir: "models/sense-voice"
  # "auto" / "zh" / "en" / "ja" / "ko" / "yue" -- SenseVoice supported langs.
  audio_language: "auto"
  # Inverse text normalization ("一二三" -> "123", punctuation).
  audio_use_itn: true
  # Decoding threads for sherpa-onnx OfflineRecognizer.
  audio_num_threads: 4
  # Optional explicit ffmpeg binary path. Leave empty to auto-detect: PATH
  # first, then the binary bundled by imageio-ffmpeg.
  ffmpeg_path: ""

data_pipeline:
  # Bump this to invalidate every cached Parquet artifact when the data lane
  # rules (column inference, sheet split policy, ...) change in a meaningful way.
  version: "data-v1"
  # Sample rows included in metadata-only Markdown previews for data-class files.
  sample_rows: 5

scan:
  # File extensions (case-insensitive, leading dot) treated as data-class
  # during convert. Data-class files default to metadata-only Markdown
  # previews, and become eligible for Parquet export when tagged ``data``.
  data_suffixes:
    - ".csv"
    - ".tsv"
    - ".xlsx"
    - ".xls"
    - ".json"
    - ".xml"
    - ".yaml"
    - ".yml"

ingest:
  # Documents are processed sequentially. Within a single document, this many
  # parallel embedding requests are fanned out to the local Ollama server
  # (chunks are sharded across these workers). Tune together with
  # OLLAMA_NUM_PARALLEL (default 4) on the Ollama side.
  concurrency: 4

mcp:
  enable_maintenance_tools: false
  default_search_mode: "hybrid"
